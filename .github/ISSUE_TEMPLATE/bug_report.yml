name: 버그 제보
description: Hack LMS가 예상대로 동작하지 않는 문제를 알려주세요.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        같은 문제가 이미 등록되어 있는지 먼저 확인해주세요.
        스크린샷이나 로그에 포함된 토큰, 쿠키, 학번 등 개인정보와 개인화된 URL은 제거해주세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 기능에서 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: url
    attributes:
      label: 문제가 발생한 페이지 링크
      description: https://canvas.ssu.ac.kr/courses/***/modules/items/*** 형태의 URL을 입력해주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hack LMS 버전
      description: 팝업 상단이나 chrome://extensions에서 확인할 수 있습니다. 확인하기 어렵다면 '모름'이라고 적어주세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 브라우저와 운영체제
      description: 가능한 경우 브라우저 버전도 함께 적어주세요.
      placeholder: Chrome / Windows 11
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 문제 발생 범위
      options:
        - 확인한 모든 영상에서 발생합니다.
        - 특정 영상에서만 발생합니다.
        - 아직 다른 영상에서는 확인하지 못했습니다.
        - 영상과 관계없는 문제입니다.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스크린샷, 오류 로그 등 도움이 될 만한 정보를 자유롭게 첨부해주세요. 개발 도구나 로그 사용법을 몰라도 괜찮습니다.
